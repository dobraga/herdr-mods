<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --amber: #e8912a; --ink: #f4f4f5; --mute: #a3a8b0; --dim: #6b7079; --bg: #0a0b0d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(1100px 900px at 78% 50%, rgba(232,145,42,.26), transparent 62%),
      radial-gradient(800px 700px at 8% 100%, rgba(84,104,220,.16), transparent 60%),
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1.4px, transparent 1.6px) 0 0 / 34px 34px,
      linear-gradient(180deg, #0c0d10, #08090b); }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .left { position: absolute; left: 120px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .tag { display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; padding: 10px 20px 10px 16px;
    border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
    font: 500 24px "JetBrains Mono", monospace; color: #e9eaec; }
  .tag i { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 18px 4px rgba(232,145,42,.55); }
  .tag b { font: 500 20px "Inter", sans-serif; color: var(--dim); padding-left: 14px; border-left: 1px solid rgba(255,255,255,.14); }
  h1 { margin-top: 44px; font-size: {{tsize}}px; white-space: nowrap; line-height: .98; letter-spacing: -0.045em; font-weight: 700;
    background: linear-gradient(180deg, #ffffff 30%, #9ea4ad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin-top: 30px; font-size: 40px; line-height: 1.28; color: var(--mute); font-weight: 400; max-width: 700px; letter-spacing: -0.01em; text-wrap: balance; }
  ul { list-style: none; margin-top: 56px; display: flex; flex-direction: column; gap: 18px; }
  li { display: flex; align-items: center; gap: 20px; font-size: 29px; color: #d9dbe0; letter-spacing: -0.005em; }
  li span { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    font: 600 19px "JetBrains Mono", monospace; color: var(--amber);
    background: rgba(232,145,42,.10); border: 1px solid rgba(232,145,42,.30); }
  .foot { position: absolute; left: 120px; bottom: 64px; font: 400 21px "JetBrains Mono", monospace; color: var(--dim); }
  .foot em { font-style: normal; color: #8b919a; }
  .right { position: absolute; right: 100px; top: 70px; bottom: 70px; width: 880px; display: flex; align-items: center; justify-content: center; }
  .glow { position: absolute; width: 980px; height: 980px; border-radius: 50%; background: radial-gradient(circle, rgba(232,145,42,.62), rgba(232,145,42,.16) 42%, transparent 70%); filter: blur(24px); }
  .shot { position: relative; max-width: 880px; max-height: 940px; border-radius: 26px; overflow: hidden; line-height: 0;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 2px 0 rgba(255,255,255,.08) inset, 0 70px 140px rgba(0,0,0,.75), 0 24px 48px rgba(0,0,0,.5); }
  .shot img { display: block; max-width: 880px; max-height: 940px; }
  .shot::after { content: ""; position: absolute; inset: 0; border-radius: 26px; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.07), transparent 28%); }
</style></head>
<body>
  <div class="bg"></div>
  <section class="left">
    <div class="tag"><i></i><span>{{name}}</span><b>Herdr mod</b></div>
    <h1>{{title}}</h1>
    <p class="lead">{{lead}}</p>
    <ul>{{points}}</ul>
  </section>
  <div class="foot"><em>herdr.dev/mods/dobraga/</em>herdr-mods--{{name}}</div>
  <section class="right"><div class="glow"></div><figure class="shot"><img src="{{image}}" style="{{mask}}"></figure></section>
</body></html>
